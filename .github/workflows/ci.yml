name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]          # push a v0.1.0-style tag to ship to TestFlight
  pull_request:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Restore and save compilation results (disable for a baseline run)
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: VisionPipeline

jobs:
  build:
    name: Build (visionOS simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools, simulator SDK, and Xcode project
        run: bash ci/setup.sh xrsimulator

      - name: Simulator compilation cache
        id: compilation-cache
        uses: ./.github/actions/compilation-cache
        with:
          sdk: xrsimulator
          configuration: Debug
          enabled: ${{ github.event_name != 'workflow_dispatch' || inputs.use_cache }}

      - name: Build
        env:
          COMPILATION_CACHE_PATH: ${{ steps.compilation-cache.outputs.path }}
          COMPILATION_CACHE_ENABLED: ${{ steps.compilation-cache.outputs.enabled }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$APP.xcodeproj" \
            -scheme "$APP" \
            -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath build \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            COMPILATION_CACHE_ENABLE_CACHING="$COMPILATION_CACHE_ENABLED" \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_PATH" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/simulator-build.log" \
            | xcbeautify --renderer github-actions

      - name: Upload simulator build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-build-log
          path: ${{ runner.temp }}/simulator-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload simulator build
        uses: actions/upload-artifact@v7
        with:
          name: VisionPipeline-simulator
          path: build/Build/Products/Debug-xrsimulator/*.app
          if-no-files-found: error

  # Needs repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, APPLE_TEAM_ID
  testflight:
    name: Ship to TestFlight
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools, device SDK, and Xcode project
        run: bash ci/setup.sh xros

      - name: Device compilation cache
        id: compilation-cache
        uses: ./.github/actions/compilation-cache
        with:
          sdk: xros
          configuration: Release

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/.appstoreconnect/AuthKey.p8

      - name: Archive (cloud-managed signing)
        env:
          COMPILATION_CACHE_PATH: ${{ steps.compilation-cache.outputs.path }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$APP.xcodeproj" \
            -scheme "$APP" \
            -configuration Release \
            -destination 'generic/platform=visionOS' \
            -archivePath build/App.xcarchive \
            -showBuildTimingSummary \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_PATH" \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee "$RUNNER_TEMP/archive-build.log" \
            | xcbeautify --renderer github-actions

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions

      - name: Clean up key
        if: always()
        run: rm -f ~/.appstoreconnect/AuthKey.p8
