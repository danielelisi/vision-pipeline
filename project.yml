# Minimal visionOS app for getting CI right. Generate with: xcodegen generate
name: VisionPipeline
options:
  bundleIdPrefix: dev.daniele
  deploymentTarget:
    visionOS: "2.0"
targets:
  VisionPipeline:
    type: application
    platform: visionOS
    sources: [VisionPipeline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.daniele.visionpipeline
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: VisionPipeline/Info.plist
      properties:
        CFBundleDisplayName: Vision Pipeline
        # Use build settings so CI can set them (XcodeGen otherwise hardcodes 1.0 / 1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No non-exempt encryption: skips TestFlight's export compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        NSHandsTrackingUsageDescription: Turn your left palm up to show the Trail Table mode menu.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
